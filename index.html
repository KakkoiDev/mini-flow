<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Flow</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="mini-flow-api" content="./mini-flow-api.json">
<link rel="describedby" type="application/json" href="./mini-flow-api.json" title="Mini Flow agent API">
<link rel="help" type="text/markdown" href="./agent-guide.md" title="Agent integration guide">
<style>
:root{color-scheme:light}
body{margin:0;background:#faf8f5;color:#242b29;font:15px system-ui,sans-serif}
main{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:9px clamp(10px,2vw,28px);background:#faf8f5;border-bottom:1px solid #e7e2dc}
h1{display:flex;align-items:center;gap:9px;margin:0 auto 0 0;font-size:21px;font-weight:750;letter-spacing:-.035em}
h1 svg{width:26px;height:26px;color:#087f71}
header button svg{width:19px;height:19px;flex:none}
header [data-fit] > svg{display:none}
header [data-fit]::before{content:"";display:block;flex:0 0 19px;width:19px;height:19px;
background:center / contain no-repeat url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23242b29%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%204H4v5m11-5h5v5M4%2015v5h5m11-5v5h-5%22%2F%3E%3C%2Fsvg%3E")}
header .header-actions{display:contents}
header .view-actions{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
header button{display:inline-flex;align-items:center;gap:7px;font:inherit;border:1px solid transparent;background:transparent;color:inherit;border-radius:8px;padding:7px 10px;min-height:38px;cursor:pointer}
header button:hover:not(:disabled){background:#f0ece6}
header button[hidden],#live-session [hidden]{display:none}
#live-toggle{white-space:nowrap}
#live-toggle svg{color:#666f69}
#live-toggle[data-active] svg{color:#087f71}
.live-state{font-size:11px;font-weight:650;line-height:1.5;padding:0 5px;border-radius:5px;background:#eeebe6;color:#525b55}
#live-toggle[data-active] .live-state{background:#e0f1e8;color:#175b50}
#live-invite{display:block;width:100%;box-sizing:border-box;margin:6px 0 12px;font:inherit;padding:8px}
#live-session form{flex-wrap:wrap}
header button:disabled{opacity:.45;cursor:default}
header #blank{border-color:#ded9d2}
header [data-panel]{background:#e4f4ee;border-color:#c9e8df}
header [data-panel][aria-expanded=true]{background:#cdebe1}
header button:focus-visible{outline:2px solid #087f71;outline-offset:2px}
#save-status:empty{display:none}
#save-status{order:1;flex-basis:100%;font-size:12px;color:#4c6660}
#editor{flex:1;min-height:0;--mini-flow-height:100%}
#editor > div{height:100%}
@media(max-width:550px){header{gap:3px;padding:5px 8px}h1{font-size:18px}
header button{font-size:13px;padding:5px 7px;min-height:44px}
header .header-actions{display:flex;flex:1 1 100%;flex-wrap:wrap;gap:3px}}
dialog{width:min(560px,calc(100% - 32px));max-height:85dvh;padding:22px;border:1px solid #ded9d2;border-radius:14px;color:inherit;background:#fffdfb}
dialog::backdrop{background:#242b2959}
dialog h2{margin:0;font-size:20px}
dialog p{margin:12px 0;overflow-wrap:anywhere}
dialog .diff{margin:12px 0;max-height:42dvh;overflow:auto;border:1px solid #e7e2dc;border-radius:8px;font:13px/1.5 ui-monospace,monospace}
dialog .diff-line{display:flex;gap:8px;padding:2px 9px;white-space:pre-wrap;overflow-wrap:anywhere}
dialog .diff-line span{flex:0 0 1em;user-select:none}
dialog .diff-add{background:#e3f6e8;color:#14532d}
dialog .diff-remove{background:#ffe8e6;color:#8b1d19}
dialog form{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
dialog button{font:inherit;padding:8px 12px;min-height:44px;border:1px solid #ded9d2;border-radius:8px;background:#fffdfb;color:inherit;cursor:pointer}
dialog #apply-proposal{background:#e4f4ee;border-color:#a7cfc4}
dialog button:disabled{opacity:.5;cursor:default}
</style>
<main>
  <header><h1><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" /><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" /></svg>Mini Flow</h1><button id="blank"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg><span>Start blank</span></button><button id="share"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 15l6 -6" /><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464" /><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /></svg><span>Copy link</span></button><span id="save-status" role="status"></span></header>
  <div id="editor"></div>
</main>
<dialog id="live-session" aria-labelledby="live-title">
  <h2 id="live-title">Live session</h2>
  <p id="live-status" role="status">Invite one agent to edit this board with you.</p>
  <div id="live-invite-row" hidden>
    <label for="live-invite">Private invite link</label>
    <input id="live-invite" readonly>
    <button id="live-copy" type="button">Copy invite</button>
  </div>
  <form method="dialog">
    <button id="live-start" type="button">Start live session</button>
    <button id="live-end" type="button" hidden>End session</button>
    <button>Close</button>
  </form>
</dialog>
<dialog id="edit-proposal" aria-labelledby="proposal-title">
  <h2 id="proposal-title">Apply diagram edit?</h2>
  <p id="proposal-message"></p>
  <p id="proposal-status" role="status"></p>
  <div id="proposal-diff" class="diff" role="region" aria-label="Diagram changes" tabindex="0"></div>
  <form method="dialog">
    <button value="cancel" autofocus>Cancel</button>
    <button id="apply-proposal" value="apply" type="button">Apply edit</button>
  </form>
</dialog>
<script src="./vendor/dagre.min.js"></script>
<script src="./mini-flow.js?v=layout-reset"></script>
<script>
const example = `flowchart TD
    A([Prompt In])
    B{Is English?}
    C{Classifier can process?}
    D[LLM tool call/answer]
    E([Result Out])
    F[Translate to English]
    G[simplify prompt]
    H{Success?}
    I[Add Analysis]

    A --> B
    B --> |yes| C
    B --> |no| F
    F --> C
    C --> |yes| D
    C --> |no| G
    G --> C
    D --> H
    H --> |yes| E
    H --> |no| I
    I --> C`;
const examplePositions = {
  A: [330, 55], B: [330, 145], C: [330, 275], D: [330, 390],
  E: [330, 585], F: [665, 145], G: [70, 275], H: [330, 485], I: [570, 495]
};
const key = 'mini-flow-edit-v1';
const prefix = '#flow=';
const proposalPrefix = '#apply=';
const joiningLive = location.hash.startsWith('#live=');
let liveBoard;
const sharedSession = (joiningLive || location.hash.startsWith(prefix) || location.hash.startsWith(proposalPrefix)) &&
  !history.state?.miniFlowLocal;
const message = document.querySelector('#save-status');
const tabId = Array.from(crypto.getRandomValues(new Uint8Array(8)),
  byte => byte.toString(16).padStart(2, '0')).join('');
if (location.protocol === 'https:' || location.protocol === 'http:') {
  const address = new URL(location.href);
  address.searchParams.set('tab', tabId);
  history.replaceState(history.state, '', address);
}
function readEdit(raw) {
  try {
    const edit = JSON.parse(raw);
    const graph = MiniFlow.parse(edit.source);
    const positions = Object.fromEntries(graph.nodes.flatMap(({ id }) => {
      const pair = edit.positions?.[id];
      return Array.isArray(pair) && pair.length === 2 && pair.every(Number.isFinite) ? [[id, pair]] : [];
    }));
    return { source: edit.source, positions };
  } catch { return null; }
}
function normalizeProject(project) {
  if (project?.version !== 1 || typeof project.source !== 'string' || !project.positions) {
    throw new Error('Invalid project.');
  }
  const graph = MiniFlow.parse(project.source);
  const positions = Object.fromEntries(graph.nodes.map(({ id }) => {
    const pair = project.positions[id];
    if (!Array.isArray(pair) || pair.length !== 2 || !pair.every(Number.isFinite)) {
      throw new Error('Invalid position for ' + id);
    }
    return [id, pair];
  }));
  return { version: 1, source: MiniFlow.stringify(graph), positions };
}
function readProposal() {
  if (!location.hash.startsWith(proposalPrefix)) return null;
  try {
    const proposal = JSON.parse(decodeURIComponent(location.hash.slice(proposalPrefix.length)));
    if (proposal.version !== 1 || typeof proposal.message !== 'string') throw new Error('Invalid edit link.');
    return { base: normalizeProject(proposal.base), project: normalizeProject(proposal.project), message: proposal.message };
  } catch {
    message.textContent = 'Could not open this diagram edit link.';
    return null;
  }
}
function restore() {
  if (location.hash.startsWith(prefix)) {
    try {
      const shared = readEdit(decodeURIComponent(location.hash.slice(prefix.length)));
      if (shared) return shared;
    } catch {}
    message.textContent = 'Could not open the shared edit.';
  }
  try {
    const local = readEdit(localStorage.getItem(key));
    return local && MiniFlow.parse(local.source).nodes.length ? local : null;
  } catch { return null; }
}
function save(source, positions) {
  const raw = JSON.stringify({ source, positions });
  if (!sharedSession) {
    try { localStorage.setItem(key, raw); } catch {}
  }
  const hash = prefix + encodeURIComponent(raw);
  if (location.hash !== hash) {
    try { history.replaceState({ miniFlowLocal: !sharedSession }, '', hash); }
    catch { message.textContent = 'Could not update the share link.'; }
  }
}
const initialProposal = readProposal();
const saved = joiningLive ? { source: 'flowchart TD', positions: {} } : initialProposal?.base ?? restore();
const guestFeatures = joiningLive ? {
  create: false, edit: false, move: false, connect: false, delete: false,
  bend: false, reconnect: false, history: false, source: false, project: false, autoLayout: false
} : {};
const editor = MiniFlow.mount(document.querySelector('#editor'), saved?.source ?? example,
  saved?.positions ?? examplePositions, { onChange(source, positions) {
      if (!joiningLive) save(source, positions);
      liveBoard?.changed();
    }, features: guestFeatures, header: document.querySelector('header'), layout: 'dock', dagre: window.dagre, settingsKey: 'mini-flow-preferences',
    colors: { canvas: '#faf8f5', grid: '#ded9d2', text: '#242b29', surface: '#fffdfb',
      stroke: '#464d49', accent: '#087f71', terminal: '#d4f2e5', step: '#e0edf8', decision: '#fff0cd' } });
window.miniFlowEditor = editor;
const repositoryLink = document.createElement('a');
repositoryLink.className = 'repo-link';
repositoryLink.href = 'https://github.com/KakkoiDev/mini-flow';
repositoryLink.target = '_blank';
repositoryLink.rel = 'noopener noreferrer';
repositoryLink.textContent = 'Source on GitHub';
document.querySelector('#editor > div').shadowRoot.querySelector('.panel').append(repositoryLink);
const headerActions = document.querySelector('header .header-actions');
const panelButton = headerActions.querySelector('[data-panel]');
const viewActions = headerActions.querySelector('.view-actions');
headerActions.append(viewActions, document.querySelector('#share'));
const liveToggle = document.createElement('button');
liveToggle.id = 'live-toggle';
liveToggle.innerHTML = '<svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.364 19.364a9 9 0 1 0 -12.728 0" /><path d="M15.536 16.536a5 5 0 1 0 -7.072 0" /><path d="M11 13a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg><span>Live session</span><span class="live-state">Off</span>';
const liveToggleState = liveToggle.querySelector('.live-state');
liveToggle.setAttribute('aria-haspopup', 'dialog');
headerActions.append(liveToggle, panelButton);
document.querySelector('#blank').hidden = joiningLive;
const proposalDialog = document.querySelector('#edit-proposal');
const applyButton = document.querySelector('#apply-proposal');
const proposalStatus = document.querySelector('#proposal-status');
let pendingProposal;
function isCurrent(base) {
  return JSON.stringify(normalizeProject(editor.getProject())) === JSON.stringify(base);
}
function renderProposalDiff(current, proposed) {
  const before = current.source.split('\n');
  const after = proposed.source.split('\n');
  for (const id of new Set([...Object.keys(current.positions), ...Object.keys(proposed.positions)])) {
    const from = current.positions[id], to = proposed.positions[id];
    if (JSON.stringify(from) === JSON.stringify(to)) continue;
    if (from) before.push('%% Position ' + id + ': ' + from.join(', '));
    if (to) after.push('%% Position ' + id + ': ' + to.join(', '));
  }
  const fragment = document.createDocumentFragment();
  function line(kind, value) {
    const row = document.createElement('div');
    row.className = 'diff-line diff-' + kind;
    const marker = document.createElement('span');
    marker.textContent = { add: '+', remove: '−', same: ' ' }[kind];
    if (kind !== 'same') marker.setAttribute('aria-label', kind === 'add' ? 'Added' : 'Removed');
    row.append(marker, document.createTextNode(value));
    fragment.append(row);
  }
  if (before.length * after.length <= 250000) {
    const lengths = Array.from({ length: before.length + 1 }, () => new Uint32Array(after.length + 1));
    for (let i = before.length - 1; i >= 0; i--) {
      for (let j = after.length - 1; j >= 0; j--) {
        lengths[i][j] = before[i] === after[j] ? 1 + lengths[i + 1][j + 1]
          : Math.max(lengths[i + 1][j], lengths[i][j + 1]);
      }
    }
    let i = 0, j = 0;
    while (i < before.length || j < after.length) {
      if (i < before.length && j < after.length && before[i] === after[j]) {
        line('same', before[i++]);
        j++;
      } else if (i < before.length && (j === after.length || lengths[i + 1][j] >= lengths[i][j + 1])) {
        line('remove', before[i++]);
      } else {
        line('add', after[j++]);
      }
    }
  } else {
    before.forEach(value => line('remove', value));
    after.forEach(value => line('add', value));
  }
  document.querySelector('#proposal-diff').replaceChildren(fragment);
}
function reviewProposal(proposal) {
  if (!proposal) return;
  pendingProposal = proposal;
  document.querySelector('#proposal-message').textContent = proposal.message || 'Review the proposed diagram edit.';
  renderProposalDiff(editor.getProject(), proposal.project);
  applyButton.disabled = !isCurrent(proposal.base);
  proposalStatus.textContent = applyButton.disabled ? 'This board has changed. Ask for an edit based on the current board.' : '';
  if (!proposalDialog.open) proposalDialog.showModal();
}
applyButton.onclick = () => {
  if (!pendingProposal || !isCurrent(pendingProposal.base)) {
    applyButton.disabled = true;
    proposalStatus.textContent = 'This board has changed. Ask for an edit based on the current board.';
    return;
  }
  const { project, message } = pendingProposal;
  try {
    editor.setProject(project, { message });
    proposalDialog.close();
  } catch (error) {
    proposalStatus.textContent = error.message;
  }
};
proposalDialog.addEventListener('close', () => {
  pendingProposal = undefined;
  if (location.hash.startsWith(proposalPrefix)) {
    const { source, positions } = editor.getProject();
    const hash = prefix + encodeURIComponent(JSON.stringify({ source, positions }));
    history.replaceState({ miniFlowLocal: !sharedSession }, '', hash);
  }
});
window.addEventListener('hashchange', () => {
  if (!location.hash.startsWith(proposalPrefix)) {
    if (proposalDialog.open) proposalDialog.close();
    return;
  }
  const proposal = readProposal();
  if (proposal) reviewProposal(proposal);
  else if (proposalDialog.open) proposalDialog.close();
});
reviewProposal(initialProposal);
document.querySelector('#blank').onclick = () => editor.setMermaid('flowchart TD');
let copyTimer;
document.querySelector('#share').onclick = async () => {
  const { source, positions } = editor.getProject();
  if (!joiningLive && !location.hash.startsWith(prefix)) save(source, positions);
  const address = new URL(location.href);
  if (joiningLive) address.hash = prefix + encodeURIComponent(JSON.stringify({ source, positions }));
  try {
    await navigator.clipboard.writeText(address.href);
    clearTimeout(copyTimer);
    message.textContent = 'Link copied.';
    copyTimer = setTimeout(() => {
      if (message.textContent === 'Link copied.') message.textContent = '';
    }, 3000);
  } catch {
    clearTimeout(copyTimer);
    message.textContent = joiningLive ? 'Could not copy the board link.' : 'Copy the link from your address bar.';
  }
};
</script>
<script type="module">
import { registerMiniFlowTools } from './mini-flow-webmcp.js?v=ai-core';
import { connectLiveBoard, newLiveInvite, readLiveInvite } from './mini-flow-live.js?v=1';

const liveDialog = document.querySelector('#live-session');
const liveStatus = document.querySelector('#live-status');
const startSession = document.querySelector('#live-start');
const endSession = document.querySelector('#live-end');
const inviteRow = document.querySelector('#live-invite-row');
const inviteInput = document.querySelector('#live-invite');
const copyInvite = document.querySelector('#live-copy');
let connectionTimer;
let copiedTimer;

function showStatus(text) {
  liveStatus.textContent = text;
  liveToggle.title = text;

  if (text === 'Live · Connected') clearTimeout(connectionTimer);
}
function ended() {
  liveBoard = undefined;
  clearTimeout(connectionTimer);
  clearTimeout(copiedTimer);
  copyInvite.textContent = 'Copy invite';
  endSession.hidden = true;
  inviteRow.hidden = true;
  delete liveToggle.dataset.active;
  liveToggleState.textContent = 'Off';
  showStatus('Session ended.');
  if (!joiningLive) startSession.hidden = false;
}
async function startLive(invite, host) {
  startSession.disabled = true;
  showStatus('Connecting…');
  try {
    liveBoard = await connectLiveBoard(invite, host, {
      getProject: editor.getProject, setProject: editor.setProject, normalize: normalizeProject,
      canAccept: () => !editor.isInteracting(), onStatus: showStatus, onEnd: ended
    });
    liveToggle.dataset.active = '';
    liveToggleState.textContent = 'On';
    endSession.hidden = false;
    endSession.textContent = host ? 'End session' : 'Leave session';
    startSession.hidden = true;
    if (host) {
      const address = new URL(location.pathname, location.origin);
      address.hash = 'live=' + invite.room + '.' + invite.password;
      inviteInput.value = address.href;
      inviteRow.hidden = false;
    }
    connectionTimer = setTimeout(() => {
      if (liveStatus.textContent.startsWith('Waiting') || liveStatus.textContent.startsWith('Receiving')) {
        showStatus(host ? 'Waiting for an editor. Keep this tab open and share the invite.'
          : 'Still waiting for the host. Check that the host tab is open.');
      }
    }, 12000);
  } catch (error) {
    showStatus('Could not start the live connection. ' + error.message);
  } finally {
    startSession.disabled = false;
  }
}
liveToggle.onclick = () => liveDialog.showModal();
startSession.onclick = () => startLive(newLiveInvite(), true);
endSession.onclick = () => liveBoard?.stop();
copyInvite.onclick = async () => {
  try {
    await navigator.clipboard.writeText(inviteInput.value);
    copyInvite.textContent = 'Copied';
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => { copyInvite.textContent = 'Copy invite'; }, 2000);
  } catch {
    inviteInput.select();
  }
};
if (joiningLive) {
  startSession.hidden = true;
  const invite = readLiveInvite(location.hash);
  if (invite) startLive(invite, false);
  else showStatus('This live invite is invalid.');
}

registerMiniFlowTools(editor, undefined, undefined, {
  tabId,
  isReady: () => !joiningLive || Boolean(liveBoard?.ready()),
  commitProject(project, message) {
    if (joiningLive) return liveBoard?.submit(project, message) ??
      { ok: false, reason: 'live_not_ready', message: 'The host is not connected.' };
    if (editor.isInteracting()) {
      return { ok: false, reason: 'host_editing', message: 'The editor is busy. Read the board before retrying.' };
    }
    editor.setProject(project, { message });
    return { ok: true };
  }
}).catch(error => console.error('Mini Flow site tools:', error));
</script>
</html>
