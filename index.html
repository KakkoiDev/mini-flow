<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Flow</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">

<style>
:root{color-scheme:light}
body{margin:0;background:#faf8f5;color:#242b29;font:15px system-ui,sans-serif}
main{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:9px clamp(10px,2vw,28px);background:#faf8f5;border-bottom:1px solid #e7e2dc}
h1{display:flex;align-items:center;gap:9px;margin:0 12px 0 0;font-size:21px;font-weight:750;letter-spacing:-.035em}
h1 svg{width:26px;height:26px;color:#087f71}
header button svg{width:19px;height:19px;flex:none}
header [data-fit] > svg{display:none}
header [data-fit]::before{content:"";display:block;flex:0 0 19px;width:19px;height:19px;
background:center / contain no-repeat url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23242b29%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%204H4v5m11-5h5v5M4%2015v5h5m11-5v5h-5%22%2F%3E%3C%2Fsvg%3E")}
header .header-actions{display:contents}
header .view-actions{display:inline-flex;align-items:center;gap:2px;margin-right:auto;white-space:nowrap}
header .compact-action{width:38px;justify-content:center;padding-inline:0}
header .compact-action > span:first-of-type{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.arrange{position:relative;z-index:4}
.arrange summary{display:flex;align-items:center;gap:6px;padding:7px 9px;min-height:38px;box-sizing:border-box;border-radius:8px;cursor:pointer;list-style:none}
.arrange summary::-webkit-details-marker{display:none}
.arrange summary:hover,.arrange[open] summary{background:#f0ece6}
.arrange summary:focus-visible{outline:2px solid #087f71;outline-offset:2px}
.arrange summary svg{width:18px;height:18px}
.arrange summary::after{content:"";width:6px;height:6px;border-right:1.5px solid;border-bottom:1.5px solid;transform:translateY(-2px) rotate(45deg)}
.arrange-options{position:absolute;top:calc(100% + 6px);right:0;display:grid;min-width:174px;padding:5px;border:1px solid #ded9d2;border-radius:10px;background:#fffdfb;box-shadow:0 6px 20px #332c2220}
.arrange-options label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;padding:0 8px;cursor:pointer}
.arrange-options label svg{display:none}
.arrange-options input{order:1;appearance:none;width:34px;height:20px;margin:0;border:1px solid #aaa59e;border-radius:20px;background:#d9d6d1;cursor:pointer}
.arrange-options input::after{content:"";display:block;width:14px;height:14px;margin:2px;border-radius:50%;background:white}
.arrange-options input:checked{background:#087f71;border-color:#087f71}
.arrange-options input:checked::after{transform:translateX(14px)}
.arrange-options input:focus-visible{outline:2px solid #087f71;outline-offset:2px}
header button{display:inline-flex;align-items:center;gap:7px;font:inherit;border:1px solid transparent;background:transparent;color:inherit;border-radius:8px;padding:7px 10px;min-height:38px;cursor:pointer}
header button:hover:not(:disabled){background:#f0ece6}
header button[hidden],#live-session [hidden]{display:none}
#live-toggle{white-space:nowrap}
#live-toggle svg{color:#666f69}
#live-toggle[data-active] svg{color:#087f71}
.live-state{display:none;width:7px;height:7px;border-radius:50%;background:#087f71}
#live-toggle[data-active] .live-state{display:block}
#live-invite{display:block;width:100%;box-sizing:border-box;margin:6px 0 12px;font:inherit;padding:8px}
#live-session form{flex-wrap:wrap}
#live-ai-options,#live-debug,#live-invite-row{margin-top:12px}
#live-ai-options summary,#live-debug summary{cursor:pointer;margin-bottom:8px}
header button:disabled{opacity:.45;cursor:default}
header #blank{border-color:#ded9d2}
header :is([data-panel],#open-saved-projects)[aria-expanded=true]{background:#e4f4ee;border-color:#c9e8df;color:#175b50}
header button:focus-visible{outline:2px solid #087f71;outline-offset:2px}
#save-status:empty,#live-notice:empty{display:none}
#save-status,#live-notice{order:1;flex-basis:100%;font-size:12px;color:#4c6660}
#workspace{position:relative;display:flex;flex:1;min-height:0}
#editor{flex:1;min-width:0;min-height:0;--mini-flow-height:100%}
#editor > div{height:100%}
@media(max-width:550px){header{gap:3px;padding:5px 8px}h1{font-size:18px}
header button,.arrange summary{font-size:13px;padding:5px 7px;min-height:44px}
header .header-actions{display:flex;flex:1 1 100%;align-items:center;flex-wrap:wrap;gap:3px}
header .view-actions{margin-right:0}
.arrange-options{left:0;right:auto}}
dialog{width:min(560px,calc(100% - 32px));max-height:85dvh;padding:22px;border:1px solid #ded9d2;border-radius:14px;color:inherit;background:#fffdfb}
dialog::backdrop{background:#242b2959}
dialog h2{margin:0;font-size:20px}
dialog p{margin:12px 0;overflow-wrap:anywhere}
dialog .diff{margin:12px 0;max-height:42dvh;overflow:auto;border:1px solid #e7e2dc;border-radius:8px;font:13px/1.5 ui-monospace,monospace}
dialog .diff-line{display:flex;gap:8px;padding:2px 9px;white-space:pre-wrap;overflow-wrap:anywhere}
dialog .diff-line span{flex:0 0 1em;user-select:none}
dialog .diff-add{background:#e3f6e8;color:#14532d}
dialog .diff-remove{background:#ffe8e6;color:#8b1d19}
dialog form{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
dialog button{font:inherit;padding:8px 12px;min-height:44px;border:1px solid #ded9d2;border-radius:8px;background:#fffdfb;color:inherit;cursor:pointer}
dialog #apply-proposal{background:#e4f4ee;border-color:#a7cfc4}
dialog button:disabled{opacity:.5;cursor:default}
#ai-reply{box-sizing:border-box;display:flex;flex:0 0 clamp(330px,34vw,460px);min-height:0;flex-direction:column;
  overflow:auto;overscroll-behavior:contain;padding:0 14px 14px;border-left:1px solid #e7e2dc;background:#fffdfb}
#ai-reply[hidden]{display:none}
#ai-reply header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;
  background:transparent;border-bottom:1px solid #e7e2dc}
#ai-reply h2{margin:0;font-size:15px;font-weight:700}
#ai-reply :is(header button,form button,.ai-reply-edit-actions button){font:inherit;font-size:13px;min-height:36px;padding:6px 10px;border:1px solid #ded9d2;
  border-radius:8px;background:#fffdfb;color:inherit;cursor:pointer}
#ai-reply button:disabled{opacity:.5;cursor:default}
#ai-reply #ai-reply-close{display:grid;place-items:center;width:36px;padding:0;border-color:transparent;background:transparent}
#ai-reply-close svg{width:18px;height:18px}
@media(max-width:849px){
  #workspace{flex-direction:column}
  #ai-reply{flex:0 0 54%;border-left:0;border-top:1px solid #e7e2dc}
}
#ai-reply-note{font-size:14px;color:#4c6660;max-height:20dvh;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap}
.ai-thread-actions,.ai-reply-edit-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px}
.ai-reply-meta{display:flex;align-items:center;gap:8px;min-height:30px}
.ai-reply-meta small{color:#52625e}
.ai-reply-menu{position:relative;margin-left:auto}
.ai-reply-menu summary{cursor:pointer;list-style:none;border-radius:6px;min-width:32px;min-height:30px;text-align:center;line-height:30px}
.ai-reply-menu summary::-webkit-details-marker{display:none}
.ai-reply-menu summary:hover,.ai-reply-menu[open] summary{background:#fffdfb}
.ai-reply-menu div{position:fixed;z-index:2;display:grid;min-width:110px;padding:4px;background:#fffdfb;border:1px solid #ded9d2;border-radius:8px;box-shadow:0 4px 12px #2a242019}
.ai-reply-menu div:not([data-positioned]){visibility:hidden}
.ai-reply-menu button{justify-content:flex-start;border:0;padding:6px 10px}
.ai-reply-delete{color:#9c2c25}
.ai-reply-edit-actions{margin-top:8px}
#ai-reply-messages{flex:1;list-style:none;margin:12px 0 0;padding:0;min-height:0;overflow:auto;display:grid;align-content:start;gap:8px;scrollbar-gutter:stable}
#ai-reply-messages li{padding:9px 12px;background:#f2eee8;border-radius:8px;overflow-wrap:anywhere}
#ai-reply-messages li[data-role=assistant]{background:#e4f4ee}
#ai-reply-messages strong{font-size:12px}
#ai-reply-messages p{white-space:pre-wrap;margin:3px 0 0}
#ai-reply-form{flex:none;display:grid;grid-template-columns:minmax(0,1fr);justify-content:stretch;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid #e7e2dc}
#ai-reply-form[hidden]{display:none}
#ai-reply textarea{max-height:25dvh;box-sizing:border-box;width:100%;font:inherit;padding:8px;border:1px solid #b8b2aa;border-radius:8px;resize:vertical}
#ai-reply-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
#ai-reply-ask{background:#e4f4ee}
#ai-reply-status{font-size:13px;color:#4c6660;margin:0}
#ai-reply-status:empty{display:none}
#ai-reply-form button[type=submit]{background:#087f71;color:white}
#ai-reply-form button[type=submit]:disabled{background:#f2eee8;color:#52625e}
#ai-reply-status[data-error]{color:#9c2c25}
</style>
<main>
  <header><h1><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" /><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" /></svg>Mini Flow</h1><button id="blank"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg><span>Start blank</span></button><button id="share"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 15l6 -6" /><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464" /><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /></svg><span>Copy link</span></button><span id="save-status" role="status"></span></header>
  <div id="workspace">
    <div id="editor"></div>

        <h2 id="ai-reply-title">Note conversation</h2>

          <button id="ai-reply-ask" type="button" title="Send the conversation and any draft to the AI guest" hidden>Ask AI</button>

</main>
<dialog id="live-session" aria-labelledby="live-title">
  <h2 id="live-title">Live session</h2>
  <p id="live-status" role="status">Invite people or agents to edit this board with you.</p>
  <p id="live-network-status" hidden></p>
  <details id="live-debug" hidden>
    <summary>Connection diagnostics</summary>
    <button id="live-debug-copy" type="button">Copy diagnostics</button>

  </details>

      <summary>AI guests</summary>
      <button id="live-copy-ai" type="button">Copy AI invite</button>
    </details>
  </div>
  <form method="dialog">
    <button id="live-start" type="button">Start live session</button>
    <button id="live-end" type="button" hidden>End session</button>
    <button>Close</button>
  </form>
</dialog>
<template id="workspace-panel-template">
  <style>
    .workspace-panel {overscroll-behavior:contain}
    .workspace-panel-heading {position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;
      gap:12px;padding:10px 14px;border-bottom:1px solid #e7e2dc;background:var(--mf-surface)}
    .workspace-panel-heading h2 {margin:0;font-size:15px;font-weight:700}
    .workspace-panel-close {display:grid;place-items:center;width:36px;height:36px;padding:0;border-color:transparent;background:transparent}
    .workspace-panel-close:hover {background:#f0ece6}
    .workspace-panel-close svg {width:18px;height:18px}
    .projects-body {padding:14px}
    #saved-project-form {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:end}
    #saved-project-form label {grid-column:1/-1;font-size:13px;font-weight:650}
    #saved-project-hint {margin:10px 0 0;font-size:12px;color:var(--mf-stroke)}
    #saved-project-name {min-width:0;min-height:40px;border-color:#ded9d2}
    [data-gist-backups] {margin:12px 0;padding:10px;border:1px solid #ded9d2;border-radius:8px}
    [data-gist-backups] label {display:grid;gap:4px;margin-top:8px;font-size:13px}
    [data-gist-backups] input,[data-gist-backups] select {width:100%;min-width:0}
    [data-gist-backups] small:not([hidden]) {display:block;margin-top:8px}
    .gist-actions {display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
    [data-gist-backups] .gist-auto {display:flex;align-items:center;gap:8px;margin-top:12px}
    [data-gist-backups] [data-gist-auto] {width:auto;margin:0;accent-color:#087f71}
    [data-gist-picker]:not([hidden]) {display:grid;gap:10px;margin-top:14px;padding:12px;
      border:1px solid #ded9d2;border-radius:8px;background:var(--mf-surface)}
    [data-gist-picker] label {margin:0;gap:6px;font-weight:650}
    [data-gist-picker] select {min-height:40px;padding:7px 10px;border:1px solid #ded9d2;
      border-radius:6px;background:#fff;color:inherit;font:inherit;font-weight:400}
    [data-gist-picker] select:focus-visible {outline:2px solid #087f71;outline-offset:2px}
    [data-gist-picker] button {justify-self:start;min-height:36px;background:#e4f4ee;border-color:#a7cfc4}
    [data-gist-status] {margin:8px 0 0;font-size:12px}
    [data-gist-status]:empty {display:none}
    #show-save-project {min-height:38px;border-color:#ded9d2;margin-bottom:10px}
    #save-project {min-height:40px;background:#e4f4ee;border-color:#a7cfc4}
    #saved-project-status {margin:10px 0 0;font-size:13px;color:var(--mf-stroke);overflow-wrap:anywhere}
    #saved-project-status:empty {display:none}
    #saved-project-list {margin:14px 0 0;padding:0;list-style:none}
    #saved-project-list li {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;
      border-top:1px solid #e7e2dc;overflow-wrap:anywhere;flex-wrap:wrap}
    #saved-project-list li:has([aria-current=true]) {background:#eaf4ef;border-radius:8px}
    #saved-project-list li > div {min-width:0}
    #saved-project-list small {display:block;margin-top:2px;color:var(--mf-stroke);font-size:12px}
    #saved-project-list button {flex:none;min-height:36px;border-color:#ded9d2}
    .project-row-actions {display:flex;gap:5px}
    .project-gist-actions {display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;flex-basis:100%}
    .project-gist-actions a {color:#175b50;font-size:13px}
    .project-gist-actions small {flex-basis:100%}
    .project-row-actions button:not(:first-child) {background:transparent;border-color:transparent;font-size:13px}
    .project-action-form {flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .project-action-form label {width:100%;font-size:13px}
    #saved-project-list .project-title {display:block;max-width:100%;min-height:28px;padding:2px 4px;margin-left:-4px;

    #saved-project-list .project-title:hover {background:#f1ede7}
    .project-title-input {width:100%;min-width:0;padding:2px 4px;margin-left:-4px;font-weight:700}
    .project-current {display:inline-block;margin-left:6px;color:#175b50;font-size:11px;font-weight:650}
    #saved-project-list li:has(.project-title-input:not([hidden])) > div:first-child {flex:1 1 100%}
    .live-guest-counter {position:absolute;bottom:calc(var(--dock-height) + var(--dock-bottom) + 10px);right:12px;z-index:2;pointer-events:none;

    @media (max-width:849px) {
      .dock-layout .workspace-panel {bottom:auto;max-height:56%;box-shadow:0 4px 16px #332c221c}
    }
  </style>
  <div class="workspace-panel-heading">
    <h2></h2>
    <button type="button" class="workspace-panel-close">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>
  </div>
</template>
<template id="projects-panel-template">
  <aside id="saved-projects" class="panel workspace-panel" aria-label="Projects" hidden>
    <div class="projects-body">
      <button id="show-save-project" type="button">+ Save as Project</button>
      <form id="saved-project-form" hidden>
        <label for="saved-project-name">Project name</label>
        <input id="saved-project-name" name="name" maxlength="80" autocomplete="off" required>
        <button id="save-project" type="submit">Save project</button>
      </form>
      <p id="saved-project-status" role="status"></p>
      <p id="saved-project-hint" hidden>Open a project below to autosave edits to it.</p>
      <details data-gist-backups>
        <summary>GitHub Gist backup</summary>
        <small><a href="https://gist.github.com/" target="_blank" rel="noopener noreferrer">Create a secret Gist</a>. Add a starter file, choose <strong>Create secret gist</strong>, then paste its URL.</small>
        <label>Gist URL or ID <input data-gist-id type="text" autocomplete="off"></label>
        <small><a href="https://github.com/settings/personal-access-tokens/new?name=Mini+Flow+Gist+backups&amp;gists=write" target="_blank" rel="noopener noreferrer">Create a fine-grained token</a>. Use the account that owns the Gist and grant <strong>Account permissions → Gists → Read and write</strong>. No repository permissions are needed.</small>
        <label>GitHub token for backups <input data-gist-token type="password" autocomplete="off"></label>
        <small>Anyone with the Gist link can read its backups. Mini Flow keeps the token in this tab’s browser session storage across reloads and sends it to GitHub for backups. Disconnect clears the saved token.</small>
        <label class="gist-auto"><input data-gist-auto type="checkbox"> Back up automatically while this project is open</label>
        <div class="gist-actions">
          <button type="button" data-gist-connect>Connect project</button>
          <button type="button" data-gist-sync>Back up now</button>
          <button type="button" data-gist-open>Find backups</button>
          <button type="button" data-gist-disconnect hidden>Disconnect</button>
        </div>
        <div data-gist-picker hidden>
          <label>Snapshot <select data-gist-snapshot></select></label>
          <button type="button" data-gist-load>Open snapshot</button>
        </div>
        <small data-gist-last-backup hidden>Last backup in this Gist · <time data-gist-backup-time></time></small>
        <p data-gist-status role="status"></p>
      </details>
      <ul id="saved-project-list" aria-label="Projects saved in this browser"></ul>
    </div>
  </aside>
</template>

    <button value="cancel" autofocus>Cancel</button>
    <button id="apply-proposal" value="apply" type="button">Apply edit</button>
  </form>
</dialog>

<script type="module">
const example = `flowchart TD
    A([Prompt In])
    B{Is English?}
    C{Classifier can process?}
    D[LLM tool call/answer]
    E([Result Out])
    F[Translate to English]
    G[simplify prompt]
    H{Success?}
    I[Add Analysis]

    A --> B
    B --> |yes| C
    B --> |no| F

  replyStatus.toggleAttribute('data-error', Boolean(replyError));
  replyStatus.textContent = replyError || (sending ? 'Sending reply…' : request?.phase === 'waiting'
    ? 'Queued for AI' : request?.phase === 'working' ? request.label + ' is working…'
      : '');
}

openAIReply = (noteId, label) => {
  showPanel(null);
  replyOpener = editorRoot.activeElement;
  if (replyTarget !== noteId) {
    replyTarget = noteId;
    replyEditor = undefined;
    replyInput.value = replyDrafts.get(noteId) ?? '';
    replyError = '';
    displayedMessages = undefined;
    replyMessages.scrollTop = 0;
  }
  replyNote.textContent = label;
  replyPanel.hidden = false;
  renderAIReply();
  replyClose.focus({ preventScroll: true });
};
function dismissReplyMenus(target) {
  for (const menu of replyMessages.querySelectorAll('.ai-reply-menu[open]')) {
    if (!target || !menu.contains(target)) menu.open = false;
  }
}
document.addEventListener('click', event => dismissReplyMenus(event.target));
replyMessages.addEventListener('scroll', () => dismissReplyMenus());
window.addEventListener('resize', () => dismissReplyMenus());
function closeAIReply(restoreFocus = false) {
  if (replyPanel.hidden) return;
  const noteId = replyTarget;
  replyPanel.hidden = true;
  replyTarget = undefined;
  replyEditor = undefined;
  dismissReplyMenus();
  if (restoreFocus) {
    const trigger = replyOpener?.isConnected && replyOpener.getClientRects().length ? replyOpener
      : editorRoot.querySelector(`[data-note-reply="${CSS.escape(noteId)}"]`);
    trigger?.focus({ preventScroll: true });
  }
  replyOpener = undefined;
}
replyClose.onclick = () => closeAIReply(true);
replyPanel.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || event.defaultPrevented) return;
  event.preventDefault();
  closeAIReply(true);
});
replyInput.oninput = () => {
  replyDrafts.set(replyTarget, replyInput.value);
  replyError = '';
  renderAIReply();
};
async function sendNoteMessage(askAI) {
  if (!replyTarget || replyForm.hidden || (askAI ? replyAsk.hidden || replyAsk.disabled : replySend.disabled)) return;
  const noteId = replyTarget;
  const draft = replyInput.value;
  const prompt = draft.trim();
  sendingReplies.add(noteId);
  renderAIReply();
  try {
    const result = askAI ? await liveBoard.askAI(noteId, prompt || undefined)
      : liveBoard ? await liveBoard.comment(noteId, prompt) : postLocalReply(noteId, prompt);
    if (result.ok && replyDrafts.get(noteId) === draft) {
      replyDrafts.delete(noteId);
      if (replyTarget === noteId) replyInput.value = '';
    }
    if (!result.ok && replyTarget === noteId) replyError = result.message;
  } catch {
    if (replyTarget === noteId) replyError = 'Could not send the reply.';
  } finally {
    sendingReplies.delete(noteId);
    renderAIReply();
  }
}
replyForm.onsubmit = event => {
  event.preventDefault();
  void sendNoteMessage(false);
};
replyAsk.onclick = () => sendNoteMessage(true);
function persistNoteThreads() {
  if (joiningLive) {
    autosaveProject?.(currentSavedProject());
    return;
  }
  const project = currentSavedProject();
  save(project.source, project.positions);
  autosaveProject?.(project);
}

function postLocalReply(noteId, text) {
  if (!text || text.length > maxReplyLength) return { ok: false, message: 'Enter a reply of up to 1000 characters.' };
  const messages = [...(noteThreads.get(noteId) ?? []), { role: 'user', author: 'You', text, replyId: crypto.randomUUID().replaceAll('-', '') }].slice(-maxThreadMessages);
  noteThreads.set(noteId, messages);
  updateNoteRequestBadges();
  persistNoteThreads();
  return { ok: true };
}

const guestCounter = document.createElement('div');
guestCounter.className = 'live-guest-counter';
guestCounter.hidden = true;
guestCounter.setAttribute('role', 'status');
guestCounter.title = 'Connected guests, excluding the host';
editorRoot.querySelector('.scroll').append(guestCounter);
const noteActions = document.createElement('div');
noteActions.className = 'note-actions';
const commentButton = document.createElement('button');
commentButton.type = 'button';
commentButton.className = 'note-action';
commentButton.textContent = 'Comment';
commentButton.dataset.noteEmpty = '';
commentButton.onclick = () => {
  const note = MiniFlow.parse(editor.getProject().source).nodes.find(node => node.id === selectedNoteId);
  if (note) openAIReply(note.id, note.label);
};
const askButton = document.createElement('button');
askButton.type = 'button';
askButton.className = 'note-action';
askButton.dataset.askAi = '';
askButton.textContent = 'Ask AI';
askButton.title = 'Send this note and its conversation to the AI guest';
noteActions.append(askButton, commentButton);
askButton.onclick = async () => {
  if (!liveBoard?.ready() || !selectedNoteId || askButton.disabled) return;
  askButton.disabled = true;
  try {
    const result = await liveBoard.askAI(selectedNoteId);
    liveNotice.textContent = result.ok ? 'Added to the AI queue.' : result.message;
  } catch {
    liveNotice.textContent = 'Could not send the note to an AI guest.';
  } finally {
    refreshAskAI();
  }
};
refreshAskAI = () => {
  askButton.hidden = !liveBoard?.ready();
  editor.setNoteAction(noteActions, !joiningLive || Boolean(liveBoard?.ready()), { below: true });
};
refreshAskAI();
updateNoteRequestBadges();
function showGuestCounts(counts) {
  renderAIReply();
  refreshAskAI();
  guestCounter.hidden = !counts;
  if (!counts) return;
  const label = counts.human + ' human · ' + counts.ai + ' AI';
  if (guestCounter.textContent !== label) guestCounter.textContent = label;
}
const codePanel = editorRoot.querySelector('.panel');
const projectsPanel = document.querySelector('#projects-panel-template').content.firstElementChild.cloneNode(true);
codePanel.after(projectsPanel);
projectsPanel.querySelector('#show-save-project').onclick = () => {
  projectsPanel.querySelector('#saved-project-form').hidden = false;
  projectsPanel.querySelector('#saved-project-name').focus();
};
const panelTemplate = document.querySelector('#workspace-panel-template').content.cloneNode(true);
const headingTemplate = panelTemplate.querySelector('.workspace-panel-heading');
editorRoot.append(panelTemplate.querySelector('style'));
const panels = [
  { button: projectsButton, panel: projectsPanel, title: 'Projects' },
  { button: panelButton, panel: codePanel, title: 'Code & export' }
];
const savedProjects = setupSavedProjects({ panel: projectsPanel,
  editor: { ...editor, getProject: currentSavedProject, setProject: openSavedProject },
  normalize: normalizeSavedProject, getActive: () => activeSavedProject, setActive: setActiveSavedProject,
  onError: text => { message.textContent = text; },
  onBackup: record => gistBackups.backupProject(record),
  getBackupTime: id => gistBackups.getBackupTime(id) });
const gistBackups = setupGistBackups({
  panel: projectsPanel.querySelector('[data-gist-backups]'),
  getActive: () => activeSavedProject,
  getProject: () => normalizeSavedProject(currentSavedProject()),
  canBackUp: () => !editor.isInteracting() && (!joiningLive || Boolean(liveBoard?.ready())),
  link: savedProjects.linkGist,
  onBackupChange: savedProjects.syncBackupTimes,
  openProject(project) {
    if (liveBoard || editor.isInteracting()) throw new Error('End the live session or finish editing before opening a backup.');
    const restored = normalizeSavedProject(project);
    setActiveSavedProject(null);
    openSavedProject(restored, { message: 'Opened Gist backup.' });
  }
});
syncSavedProjects = () => { savedProjects.syncActive(); gistBackups.refresh(); };
autosaveProject = savedProjects.autosave;

function showPanel(active) {
  if (active) closeAIReply();
  for (const { button, panel } of panels) {
    panel.hidden = panel !== active;
    button.setAttribute('aria-expanded', String(panel === active));
  }
  if (active === projectsPanel) savedProjects.refresh();
}

for (const { button, panel, title } of panels) {
  panel.classList.add('workspace-panel');
  panel.setAttribute('aria-label', title);
  const heading = headingTemplate.cloneNode(true);
  heading.querySelector('h2').textContent = title;
  const close = heading.querySelector('button');
  close.setAttribute('aria-label', 'Close ' + title);
  close.onclick = () => {
    showPanel(null);
    button.focus();
  };
  panel.prepend(heading);
  panel.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      close.click();
    }
  });
  button.onclick = () => showPanel(panel.hidden ? panel : null);
}
showPanel(null);

const liveDialog = document.querySelector('#live-session');
const liveStatus = document.querySelector('#live-status');
const liveNetworkStatus = document.querySelector('#live-network-status');
const startSession = document.querySelector('#live-start');
const endSession = document.querySelector('#live-end');
const inviteRow = document.querySelector('#live-invite-row');
const inviteInput = document.querySelector('#live-invite');
const copyInvite = document.querySelector('#live-copy');
const copyAIInvite = document.querySelector('#live-copy-ai');
const aiOptions = document.querySelector('#live-ai-options');
const debugEnabled = new URL(location.href).searchParams.get('debug') === '1';
const debugPanel = document.querySelector('#live-debug');
const debugText = document.querySelector('#live-debug-text');
const debugStatus = document.querySelector('#live-debug-status');
let debugAttempt;
let connectionTimer;
let liveNetwork;
let connectionWaited = false;
let copiedTimer;

function liveDebugReport() {
  if (!debugAttempt) return null;
  const { started, role, stages, network } = debugAttempt;
  return { role, elapsedMs: Math.round(performance.now() - started), stages: [...stages],
    p2p: network?.() ?? null };
}

if (debugEnabled) {
  window.miniFlowLiveDebug = liveDebugReport;
  document.querySelector('#live-debug-copy').onclick = async () => {
    const report = liveDebugReport();
    if (!report) return;
    const json = JSON.stringify(report, null, 2);
    try {
      await navigator.clipboard.writeText(json);
      debugStatus.textContent = 'Diagnostics copied.';
    } catch {
      debugText.hidden = false;
      debugText.value = json;
      debugText.select();
      debugStatus.textContent = 'Copy the selected text.';
    }
  };
}

function traceLiveStage(stage) {
  if (!debugAttempt || debugAttempt.stages.at(-1)?.stage === stage) return;
  const stages = debugAttempt.stages;
  stages.push({ stage, ms: Math.round(performance.now() - debugAttempt.started) });
  if (stages.length > 100) stages.shift();
}

function logLiveDebug(outcome) {
  if (debugEnabled) console.info('[Mini Flow live]', outcome, liveDebugReport());
}

function lacksLiveWebRTC() {
  const server = liveNetwork?.transports.server;
  if (server?.state === 'connecting' || server?.state === 'ready') return false;
  return liveNetwork?.transports.relays?.state === 'unavailable' &&
    typeof globalThis.RTCPeerConnection !== 'function';
}

function showStatus(text) {
  if (text.startsWith('Waiting for') && lacksLiveWebRTC()) {
    text = joiningLive
      ? 'WebRTC is unavailable in this browser. Open the invite in Firefox or Chrome to join.'
      : 'WebRTC is unavailable in this browser. Use Firefox or Chrome to host across devices.';
    traceLiveStage('webrtc-unavailable');
  }
  liveStatus.textContent = text;
  liveToggle.title = text;
  if (joiningLive && text !== 'Sending edit…') liveNotice.textContent = text === 'Live · Connected' ? '' : text;
  if (text.startsWith('Live ·')) clearTimeout(connectionTimer);
  if (!debugAttempt) return;
  if (text.startsWith('Waiting for')) traceLiveStage('waiting-for-peer');
  if (text.startsWith('Receiving the board')) traceLiveStage('receiving-board');
  if (text.startsWith('Could not request the board')) traceLiveStage('board-request-failed');
  if (text.startsWith('Could not send the board')) traceLiveStage('board-send-failed');
  if (text.startsWith('Could not read the live board')) traceLiveStage('board-read-failed');
  if (text.startsWith('Host disconnected')) traceLiveStage('host-disconnected');
  if (text.startsWith('Live ·') && debugAttempt.stages.at(-1)?.stage !== 'connected') {
    traceLiveStage('connected');
    queueMicrotask(() => logLiveDebug('connected'));
  }
}
function showNetworkStatus(status) {
  liveNetwork = status;
  const relays = status.transports.relays;
  liveNetworkStatus.hidden = !relays;
  if (!relays) return;
  const hint = connectionWaited && diagnose(status, 12000);
  const signaling = hint || (relays.state === 'unavailable'
    ? 'Internet signaling unavailable · ' + relays.detail
    : `Signaling relay sockets open · ${relays.open} of ${relays.total}`);
  const server = status.transports.server;
  liveNetworkStatus.textContent = server ? `${signaling} · WebSocket relay: ${server.state}` : signaling;
}

function ended() {
  traceLiveStage('ended');
  logLiveDebug('ended');
  closeAIReply();
  replyDrafts.clear();
  const wasGuest = joiningLive;
  joiningLive = false;
  liveBoard = undefined;
  refreshAskAI();
  liveNetwork = undefined;
  connectionWaited = false;
  liveNetworkStatus.hidden = true;
  clearTimeout(connectionTimer);
  clearTimeout(copiedTimer);
  copyInvite.textContent = 'Copy invite';
  copyAIInvite.textContent = 'Copy AI invite';
  aiOptions.open = false;
  endSession.hidden = true;
  inviteRow.hidden = true;
  inviteInput.value = '';
  delete liveToggle.dataset.active;
  liveToggle.setAttribute('aria-label', 'Live session');
  startSession.hidden = false;
  if (wasGuest) {
    setGuestAvailability(true);
    editor.setHistoryEnabled(true);
    const { source, positions } = editor.getProject();
    save(source, positions);
    showStatus('Session ended. You can keep editing this copy.');
    liveNotice.textContent = liveStatus.textContent;
    if (liveDialog.open) liveDialog.close();
  } else {
    showStatus('Session ended.');
  }
}
async function startLive(invite, host) {
  startSession.disabled = true;
  if (host) liveNotice.textContent = '';
  if (debugEnabled) {
    debugAttempt = { started: performance.now(), role: host ? 'host' : 'guest', stages: [] };
    debugPanel.hidden = false;
    debugText.hidden = true;
    debugText.value = '';
    debugStatus.textContent = '';
    traceLiveStage('connecting');
  }
  showStatus('Connecting…');
  try {
    liveBoard = await connectLiveBoard(invite, host, {
      getProject: editor.getProject, setProject: editor.setProject, normalize: normalizeProject,
      canAccept: () => !editor.isInteracting(), onStatus: showStatus, onEnd: ended,
      onAvailability: setGuestAvailability, onPresence: editor.setPeerPresence, onGuestCounts: showGuestCounts,
      onNetworkStatus: showNetworkStatus, debug: debugEnabled,
      onNoteColors: editor.setNoteColors, initialThreads: [...noteThreads],
      onAIRequests(next) {
        noteRequests = next;
        updateNoteRequestBadges();
        renderAIReply();
      },
      onAIThread(noteId, messages) {
        if (messages) noteThreads.set(noteId, messages);
        else noteThreads.delete(noteId);
        updateNoteRequestBadges();
        if (replyTarget === noteId) renderAIReply();
        persistNoteThreads();
      },
      noteIds: project => MiniFlow.parse(project.source).nodes.filter(node => node.type === 'note').map(node => node.id),
      readNote(project, id) {
        const graph = MiniFlow.parse(project.source);
        const note = graph.nodes.find(node => node.type === 'note' && node.id === id);
        if (!note) return null;
        const edge = Number.isInteger(note.target) ? graph.edges[note.target] : null;
        return { id, text: note.label.slice(0, 4000), target: edge
          ? { type: 'arrow', from: edge.from, to: edge.to }
          : typeof note.target === 'string' ? { type: 'node', id: note.target } : null };
      }
    });
    if (debugAttempt) debugAttempt.network = liveBoard.debugReport;
    refreshAskAI();
    liveToggle.dataset.active = '';
    liveToggle.setAttribute('aria-label', 'Live session, active');
    endSession.hidden = false;
    endSession.textContent = host ? 'End session' : 'Leave session';
    startSession.hidden = true;
    const address = new URL(location.pathname, location.origin);
    if (debugEnabled) address.searchParams.set('debug', '1');
    address.hash = 'live=' + invite.room + '.' + invite.password;
    inviteInput.value = address.href;
    inviteRow.hidden = false;
    if (lacksLiveWebRTC()) logLiveDebug('WebRTC unavailable');
    connectionTimer = setTimeout(() => {
      if (liveStatus.textContent.startsWith('Waiting') || liveStatus.textContent.startsWith('Receiving')) {
        connectionWaited = true;
        if (liveNetwork) showNetworkStatus(liveNetwork);
        const receiving = liveStatus.textContent.startsWith('Receiving');
        showStatus(host ? 'Waiting for guests. Keep this tab open and share the invite.'
          : receiving ? 'Still receiving the board…' : 'Still connecting. Keep this tab and the host tab open.');
        traceLiveStage(receiving ? 'board-transfer-slow' : 'peer-discovery-slow');
        logLiveDebug('still waiting after 12 seconds');
      }
    }, 12000);
  } catch (error) {
    showStatus('Could not start the live connection. ' + error.message);
    traceLiveStage('start-failed');
    logLiveDebug('start failed');
  } finally {
    startSession.disabled = false;
  }
}
liveToggle.onclick = () => liveDialog.showModal();
startSession.onclick = () => startLive(newLiveInvite(), true);
endSession.onclick = () => liveBoard?.stop();
window.addEventListener('pagehide', () => {
  if (liveBoard?.host) liveBoard.stop();
});
copyInvite.onclick = async () => {
  try {
    await navigator.clipboard.writeText(inviteInput.value);
    copyInvite.textContent = 'Copied';
    clearTimeout(copiedTimer);
    copiedTimer = setTimeout(() => { copyInvite.textContent = 'Copy invite'; }, 2000);
  } catch {
    inviteInput.select();
  }
};
copyAIInvite.onclick = async () => {
  try {
    await navigator.clipboard.writeText([
      'Join this Mini Flow live session as an AI guest using WebMCP.',
      'Open the invite in a browser with WebMCP tool access. Wait for Live · Connected, call register_live_agent with {}, then use get_board and wait_for_ai_request.',
      'Keep listening until the session disconnects or I ask you to stop. A null request is a timeout or an unclaimed request. Call wait_for_ai_request again using the last handled sequence as after (start at 0). After answering or applying an edit, report the result and immediately resume waiting instead of ending your turn.',
      inviteInput.value
    ].join('\n\n'));
    copyAIInvite.textContent = 'AI invite copied';
  } catch {
    showStatus('Could not copy the AI invite.');
  }
};
if (joiningLive) {
  startSession.hidden = true;
  const invite = readLiveInvite(location.hash);
  if (invite) startLive(invite, false);
  else showStatus('This live invite is invalid.');
}

registerMiniFlowTools(editor, undefined, undefined, {
  registerAgent: joiningLive ? () => liveBoard?.registerAgent() ?? { ok: false, reason: 'live_not_ready' } : undefined,
  waitForAIRequest: joiningLive ? (after, timeoutMs) => liveBoard?.waitForAIRequest(after, timeoutMs) ??
    { ok: false, reason: 'live_not_ready', message: 'The host is not connected.' } : undefined,
  reportAIActivity: joiningLive ? (message, result) => liveBoard?.reportAIActivity(message, result) ??
    { ok: false, reason: 'live_not_ready', message: 'The host is not connected.' } : undefined,
  isReady: () => !joiningLive || Boolean(liveBoard?.ready()),
  commitProject(project, message) {
    if (joiningLive) {
      if (!liveBoard) return { ok: false, reason: 'live_not_ready', message: 'The host is not connected.' };
      return liveBoard.submitAIEdit(project, message);
    }
    if (editor.isInteracting()) {
      return { ok: false, reason: 'host_editing', message: 'The editor is busy. Read the board before retrying.' };
    }
    editor.setProject(project, { message });
    return { ok: true };
  }
}).catch(error => console.error('Mini Flow site tools:', error));
</script>
