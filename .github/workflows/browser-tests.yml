name: Browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test@1.52.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test tests/live-session.test.mjs tests/parse.test.mjs tests/agents.test.mjs
      - run: npx playwright test tests/editor.spec.cjs
